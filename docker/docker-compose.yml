services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sevasangam_db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sevasangam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sevasangam_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sevasangam}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sevasangam} -d ${POSTGRES_DB:-sevasangam}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
    driver: local
